[project]
name = "fraud-service"
version = "0.1.0"
description = "Fraud-scoring notebook (pre-refactor)"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "scikit-learn",
    "joblib",
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "structlog",

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_service"]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-cov", "ruff", "mypy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=fraud_service --cov-branch --cov-report=term-missing"
markers = [
  "unit: fast, no I/O",
  "integration: app-level via TestClient",
  "behavioural: exercises the real model artefact",
  "slow: excluded from the per-commit gate",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/fraud_service"]
omit = [
    "src/fraud_service/adapters/*",
    "src/fraud_service/batch.py",
]

[tool.coverage.report]
fail_under = 80


[tool.ruff.lint]
ignore = ["B008"]


[tool.importlinter]
root_package = "fraud_service"

[[tool.importlinter.contracts]]
name = "Clean architecture layers"
type = "layers"
layers = [
    "fraud_service.api",
    "fraud_service.adapters",
    "fraud_service.service",
    "fraud_service.domain",
]

[[tool.mypy.overrides]]
module = ["joblib.*", "pandas.*"]
ignore_missing_imports = true