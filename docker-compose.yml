services:
  fraud-api:
    build: .
    image: fraud-service:dev
    ports:
      - "8000:8000"
    depends_on:
      feature-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
  feature-cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s 
      retries: 5 


  loadtest:
    image: williamyeh/hey
    profiles: ["loadtest"]
    depends_on:
      fraud-api:
        condition: service_healthy
    entrypoint: ["/hey", "-n", "2000", "-c", "25", "-m", "POST",
             "-D", "/sample.json", "-T", "application/json",
             "http://fraud-api:8000/v1/predict"]
    volumes:
      - ./payloads/sample.json:/sample.json:ro